# Publishes a signed APK to GitHub Releases. The app checks the latest release and updates itself.
# Release steps: bump "version" in package.json, commit, then push a tag v<version> or run this workflow manually (Actions tab).
name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The action's default package list contains the removed 'tools' package, so install only what we name below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Release tag from package.json
        run: echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm test
      - name: Restore signing key
        env:
          SIGNING: ${{ secrets.VORBI_SIGNING }}
        run: |
          test -n "$SIGNING" || { echo "Secret VORBI_SIGNING is missing"; exit 1; }
          PASS=$(echo "$SIGNING" | sed -n 1p)
          echo "$SIGNING" | sed -n 2p | base64 -d > android/vorbi-release.jks
          {
            echo "storeFile=vorbi-release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=vorbi"
            echo "keyPassword=$PASS"
          } > android/keystore.properties
      - name: Build APK
        run: npm run android
      - name: Verify the signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Name the artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Vorbi-${TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "Vorbi-${TAG}.aab"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Vorbi-${{ env.TAG }}.apk
            Vorbi-${{ env.TAG }}.aab
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
